<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBTI气象局人格测试</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>🌦️ SBTI气象局人格测试</h1>
      <p class="subtitle">30道单选题，测出你在气象局最像哪个岗位人格</p>

      <section id="start-screen" class="card active">
        <h2>开测前提示</h2>
        <ul>
          <li>全程 30 题，约 4-6 分钟。</li>
          <li>没有标准答案，选第一直觉即可。</li>
          <li>结果偏娱乐+自嘲，不是职业能力评定。</li>
        </ul>
        <button id="start-btn">开始测试</button>
      </section>

      <section id="quiz-screen" class="card">
        <div class="progress-wrap">
          <div id="progress-bar"></div>
        </div>
        <p id="progress-text"></p>
        <h2 id="question-stem"></h2>
        <div id="options"></div>
      </section>

      <section id="result-screen" class="card">
        <img id="result-image" alt="人格插图" />
        <h2 id="result-title"></h2>
        <p id="result-job" class="pill"></p>
        <p id="result-tagline"></p>
        <p id="result-description"></p>
        <p id="result-roast" class="roast"></p>
        <button id="retry-btn">再测一次</button>
      </section>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
